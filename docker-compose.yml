version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.1
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    IQAIR_API_KEY: '${IQAIR_API_KEY}'
    MINIO_ENDPOINT: 'minio:9000'
    MINIO_ACCESS_KEY: '${MINIO_ROOT_USER}'
    MINIO_SECRET_KEY: '${MINIO_ROOT_PASSWORD}'
    
    _PIP_ADDITIONAL_REQUIREMENTS: pandas requests pytrends dbt-postgres minio
  volumes:
    
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data_lake:/opt/airflow/data_lake
    - ./dbt_aerohealth:/opt/airflow/dbt_aerohealth
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    - postgres

services:
  # 1. Database untuk metadata Airflow
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  # 2. Database Data Warehouse
  postgres_dwh:
    image: postgres:13
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: aerohealth_dwh
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
    ports:
      # Menggunakan port 5433 agar tidak bentrok dengan database Airflow
      - 5433:5432

  # 3. Inisialisasi Airflow (Berjalan sekali di awal)
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow

  # 4. Airflow Webserver (Tampilan UI)
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - 8081:8080
    restart: always

  # 5. Airflow Scheduler (Yang menjalankan otomatisasi)
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  
  metabase:
    image: metabase/metabase:latest
    container_name: aerohealth-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    restart: always

  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-26T01-06-18Z
    container_name: aerohealth-minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  postgres_data:
  postgres_dwh_data:
  metabase_data:
  minio_data:

